<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yard Eye">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5C2E0E">
<title>NOVA Yard Eye</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{--navy:#5C2E0E;--navy2:#7A3E14;--rust:#D9731E;--gold:#C9962B;--bg:#F7F1E7;--paper:#fff;--ink:#2B1D12;--muted:#7A6A5C;--line:#EADFCF;--good:#1D9E75;--good-soft:#E1F5EE;--warn:#B8760F;--warn-soft:#FBEFD6;--bad:#A32D2D;--bad-soft:#FCEBEB;--info:#B4560F;--info-soft:#FDEBDD;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;overscroll-behavior:none}
button{font-family:inherit;font-size:16px;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
button.primary{background:var(--navy);color:#fff;font-weight:700}
button.accent{background:var(--rust);color:#fff;font-weight:700}
button.ghost{background:transparent;box-shadow:none;color:var(--muted)}
button.danger{background:var(--bad-soft);color:var(--bad)}
button:disabled{opacity:.45}
button.big{padding:18px;font-size:19px;border-radius:16px;width:100%}
input,select,textarea{font-family:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
input.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;font-weight:700;text-transform:uppercase}
.hdr{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,var(--navy) 0%,var(--navy2) 60%,var(--rust) 100%);color:#fff;border-bottom:4px solid var(--gold);padding:calc(8px + var(--sat)) 12px 8px;display:flex;align-items:center;gap:10px}
.hdr .lg{background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hdr .lg img{height:30px;display:block}
.hdr .lg.cust img{height:22px}
.hdr .cap{font-size:10px;color:var(--gold);letter-spacing:1.5px;font-weight:600;white-space:nowrap}
.hdr .t{font-weight:700;color:#fff;line-height:1.15;font-size:17px;white-space:nowrap}
.hdr .ver{margin-left:6px;font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;background:#1a7f5a;color:#fff;vertical-align:middle}
.hdr .sp{flex:1}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--gold);color:var(--navy)}
.pill.qc{background:var(--rust);color:#fff}
.hdr .sw{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;padding:4px 9px;font-size:20px;border-radius:8px}
.pill{white-space:nowrap}
@media (max-width:600px){.hdr{gap:8px;padding-left:10px;padding-right:10px}.hdr .cap{font-size:9px;letter-spacing:1px}.hdr .cap .yard{display:none}.hdr .t{font-size:15px}.hdr .lg{padding:2px 6px}.hdr .lg img{height:26px}.hdr .lg.cust{display:none}.hdr .ver{display:none}.pill{font-size:12px;padding:4px 8px}}
.wrap{padding:14px 14px calc(24px + var(--sab));max-width:640px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 8px;color:var(--navy)}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px}
.li .no{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.05em;font-size:17px}
.tag{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.tag.g{background:var(--good-soft);color:var(--good)}.tag.y{background:var(--warn-soft);color:var(--warn)}.tag.r{background:var(--bad-soft);color:var(--bad)}.tag.n{background:var(--info-soft);color:var(--info)}
/* camera */
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:62vh}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .guide{position:absolute;left:8%;right:8%;top:38%;height:18%;border:2px dashed rgba(255,255,255,.75);border-radius:8px;pointer-events:none}
.cam .lbl{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:999px;font-size:13px}
.cam .cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.shutter{display:flex;justify-content:center;align-items:center;gap:20px;padding:12px 0}
.shutter .btn{width:78px;height:78px;border-radius:50%;background:#fff;border:6px solid #cfd6dd;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.shutter .btn:active{transform:scale(.94)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.th{position:relative;flex:0 0 auto;width:84px;height:84px;border-radius:10px;overflow:hidden;background:#ddd;border:2px solid transparent}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .b{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:2px 4px;background:rgba(0,0,0,.6);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.g{border-color:var(--good)}.th.r{border-color:var(--bad)}.th.y{border-color:var(--warn)}.th.p{border-color:#9aa}
.fileless{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#fff;gap:10px;padding:20px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sab));background:#1B2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:15px;max-width:92vw}
.big{font-size:30px;font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.08em;text-align:center;padding:8px 0}
.bigrow{font-size:40px;font-weight:700;text-align:center;color:var(--navy)}
.fab{position:fixed;right:14px;top:calc(60px + var(--sat));z-index:6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + var(--sab));width:100%;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:#eee}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:8px 14px}
.tabs button.on{background:var(--gold);color:var(--navy)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.admin .wrap{max-width:1100px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="hdr">
  <div class="lg"><img id="logo" alt="NOVA"></div>
  <div><div class="cap">NOVA CONTAINER<span class="yard"> · ลานตู้ BCDS</span></div><div class="t">NOVA Yard Eye<span class="ver">v1.1</span></div></div>
  <div class="sp"></div>
  <span class="pill" id="modePill">แปลนลาน</span>
  <button class="sw" id="btnSwitch" title="สลับโหมด">⇄</button>
  <div class="lg cust"><img id="logoCust" alt="BCDS"></div>
</div>
<div id="app" class="wrap"></div>
<input type="file" id="fileIn" accept="image/*" capture="environment" hidden>
<div id="toast" class="toast" hidden></div>

function gs(fn){ // เรียกฟังก์ชันฝั่งเซิร์ฟเวอร์: ใช้ google.script.run ถ้าเปิดผ่าน Apps Script, ไม่งั้นยิง HTTP ไปที่ API_URL
  var args = Array.prototype.slice.call(arguments,1);
  if(window.google && google.script && google.script.run){
    return new Promise(function(res,rej){
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(e); });
      r[fn].apply(r,args);
    });
  }
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(j){ if(!j||!j.ok) throw new Error((j&&j.error)||'server error'); return j.result; });
}

var LV={A:10,B:12,C:13,D:14,E:15,F:16,G:17,H:18,I:19,J:20,K:21,L:23,M:24,N:25,O:26,P:27,Q:28,R:29,S:30,T:31,U:32,V:34,W:35,X:36,Y:37,Z:38};
function validNo(no){ no=String(no||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(!/^[A-Z]{4}\d{7}$/.test(no)) return false; var s=0; for(var i=0;i<10;i++){ var c=no.charAt(i); var v=i<4?LV[c]:parseInt(c,10); if(v===undefined) return false; s+=v*Math.pow(2,i);} var cd=s%11; if(cd===10) cd=0; return cd===parseInt(no.charAt(10),10); }
function cleanNo(no){ return String(no||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

async function startCam(videoEl){
  if(S.cam.stream){ videoEl.srcObject=S.cam.stream; try{await videoEl.play();}catch(e){} return true; }
  S.cam.tried=true;
  try{
    var st = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}},audio:false});
    S.cam.stream=st; S.cam.ok=true; videoEl.srcObject=st; await videoEl.play(); return true;
  }catch(e){ S.cam.ok=false; return false; }
}
function stopCam(){ if(S.cam.stream){ S.cam.stream.getTracks().forEach(function(t){t.stop();}); S.cam.stream=null; } }

function grabFrame(videoEl){
  return new Promise(function(res){
    var c=document.createElement('canvas'); c.width=videoEl.videoWidth; c.height=videoEl.videoHeight;
    c.getContext('2d').drawImage(videoEl,0,0);
    res(c);
  });
}
function fileToCanvas(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file); var img=new Image();
    img.onload=function(){ var c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); URL.revokeObjectURL(url); res(c); };
    img.onerror=function(){ rej(new Error('อ่านรูปไม่ได้')); }; img.src=url;
  });
}
function processCanvas(src, wmText){
  var maxPx=(S.today&&S.today.maxPx)||1600, q=(S.today&&S.today.jpegQ)||0.82, pos=(S.today&&S.today.wmPos)||'bl';
  var sc=Math.min(1, maxPx/Math.max(src.width,src.height));
  var w=Math.round(src.width*sc), hh=Math.round(src.height*sc);
  var c=document.createElement('canvas'); c.width=w; c.height=hh; var ctx=c.getContext('2d'); ctx.drawImage(src,0,0,w,hh);
  var b64raw=c.toDataURL('image/jpeg',q).split(',')[1];
  // watermark
  var fs=Math.max(14,Math.round(w*0.024)); ctx.font='700 '+fs+'px Sarabun, Arial, sans-serif'; ctx.textBaseline='bottom';
  var pad=Math.round(fs*0.6); var tw=ctx.measureText(wmText).width;
  var x=pos.indexOf('r')>=0 ? w-tw-pad : pad; var y=pos.indexOf('t')>=0 ? fs+pad : hh-pad;
  ctx.lineWidth=Math.max(2,fs/6); ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.strokeText(wmText,x,y); ctx.fillStyle='#fff'; ctx.fillText(wmText,x,y);
  var b64wm=c.toDataURL('image/jpeg',q).split(',')[1];
  var t=document.createElement('canvas'); var ts=Math.min(1,240/Math.max(w,hh)); t.width=Math.round(w*ts); t.height=Math.round(hh*ts); t.getContext('2d').drawImage(c,0,0,t.width,t.height);
  return {b64raw:b64raw,b64wm:b64wm,thumb:t.toDataURL('image/jpeg',0.6),w:w,h:hh};
}

/* ===================== upload queue ===================== */
// คิวอัปโหลด: ส่งพร้อมกันไม่เกิน 2 รูป และลองซ้ำอัตโนมัติ 2 ครั้งถ้าเซิร์ฟเวอร์ตอบผิดพลาด (กัน 404/หลุดตอนยิงหลายรูปพร้อมกัน)
var UPQ={running:0,max:2,queue:[]};
function queuePhoto(photo, path, meta){
  photo.status='up'; photo.tries=photo.tries||0;
  UPQ.queue.push({photo:photo,path:path,meta:meta}); pumpUploads();
}
function pumpUploads(){
  while(UPQ.running<UPQ.max && UPQ.queue.length){ var job=UPQ.queue.shift(); UPQ.running++; doUpload(job); }
}
function doUpload(job){
  var photo=job.photo;
  gs('uploadPhoto',{b64:photo.b64wm,name:photo.name,path:job.path,meta:job.meta}).then(function(r){ photo.serverId=r.id; photo.uploaded=true; if(photo.status==='up') photo.status='ok'; })
   .catch(function(e){ photo.tries++; if(photo.tries<3){ setTimeout(function(){ UPQ.queue.push(job); pumpUploads(); },1500*photo.tries); } else { photo.status='err'; photo.err='อัปโหลดไม่สำเร็จ: '+(e.message||e); } })
   .then(function(){ UPQ.running--; renderSessionSoft(); pumpUploads(); });
}
function ocrPhoto(photo){
  photo.ocr='pending';
  gs('ocrContainers',photo.b64raw).then(function(r){
    if(!r.ok){ photo.ocr='err'; photo.err=r.error; photo.numbers=[]; }
    else { photo.ocr='done'; photo.numbers=r.numbers||[]; }
    afterOcr(photo); renderSessionSoft();
  }).catch(function(e){ photo.ocr='err'; photo.err=String(e.message||e); photo.numbers=[]; renderSessionSoft(); });
}
function afterOcr(photo){
  var ss=S.session; if(!ss) return;
  if(ss.kind==='row'){
    (photo.numbers||[]).forEach(function(n){
      var ex=ss.items.filter(function(i){return i.no===n.no;})[0];
      if(ex){ ex.dup=true; return; }
      ss.items.push({no:n.no, valid:n.valid, raw:n.raw, fileId:photo.serverId||'', photoK:photo.k, manual:false, inav:false});
    });
    ss.items.forEach(function(i){ if(!i.fileId){ var p=ss.photos.filter(function(x){return x.k===i.photoK;})[0]; if(p&&p.serverId) i.fileId=p.serverId; } });
  } else if(ss.kind==='qc' && ss.step==='number'){
    var n=(photo.numbers||[])[0];
    if(n){ ss.no=n.no; ss.noValid=n.valid; } else { ss.no=''; ss.noValid=false; }
    ss.step='confirmNo'; render();
  }
}
function photoClass(p){ if(p.status==='err'||p.ocr==='err') return 'r'; if(p.ocr==='pending'||p.status==='up') return 'p'; if(p.numbers&&p.numbers.length&&p.numbers.every(function(n){return n.valid;})) return 'g'; if(p.numbers&&p.numbers.length) return 'y'; if(p.ocr==='done'&&(!p.numbers||!p.numbers.length)) return 'r'; return 'g'; }
function photoLabel(p){ if(p.status==='err') return '⚠ ส่งไม่ได้'; if(p.ocr==='pending') return 'กำลังอ่าน…'; if(p.ocr==='err') return '⚠ อ่านไม่ได้'; if(p.numbers){ if(!p.numbers.length) return '✗ ไม่พบเบอร์'; return p.numbers.map(function(n){return (n.valid?'✓':'✗')+n.no.slice(-7);}).join(' '); } return p.status==='up'?'กำลังส่ง…':'✓'; }

async function takeShot(kind){ // kind: 'sign' | 'container' | 'qcnum' | 'qcdmg'
  var ss=S.session; if(!ss) return;
  var v=$('vid'); var canvas;
  try{
    if(S.cam.ok && v && v.videoWidth){ canvas=await grabFrame(v); }
    else { var f=await pickFile(); if(!f) return; canvas=await fileToCanvas(f); }
  }catch(e){ toast('ถ่ายไม่สำเร็จ: '+(e.message||e)); return; }
  var wm=S.name+' '+nowTxt()+(ss.kind==='qc'&&ss.no?' '+ss.no:'');
  var out=processCanvas(canvas,wm);
  var photo={k:++ss.k,thumb:out.thumb,b64raw:out.b64raw,b64wm:out.b64wm,name:(ss.kind==='row'?'row_':'qc_')+Date.now()+'_'+ss.k+'.jpg',status:'new',numbers:null,ocr:null};
  if(kind==='sign'){
    ss.signPhoto=photo; ss.step='signWait'; render();
    try{ var r=await gs('ocrRowSign',photo.b64raw); ss.signText=r.ok?r.text:''; ss.row=r.ok?(r.match||''):''; ss.signErr=r.ok?'':r.error; }catch(e){ ss.signErr=String(e.message||e); ss.row=''; }
    ss.step='signConfirm'; render(); return;
  }
  ss.photos.push(photo);
  if(kind==='container'){ queuePhoto(photo,['_inbox',ss.sid],{row:ss.row,by:S.name}); ocrPhoto(photo); }
  if(kind==='qcnum'){ ss.numPhoto=photo; ss.step='number'; render(); queuePhoto(photo,['_inbox',ss.sid],{by:S.name,kind:'number'}); ocrPhoto(photo); return; }
  if(kind==='qcdmg'){ queuePhoto(photo,['_inbox',ss.sid],{no:ss.no,tag:ss.tag,by:S.name}); }
  renderSessionSoft();
}

function confirmListHtml(ss){

  var cache=null;
  async function load(){ var f=$('dFrom').value, t=$('dTo').value; if(!f||!t){toast('เลือกวันที่');return null;} if(f>t){ var x=f; f=t; t=x; } $('dlRes').innerHTML='กำลังดึงข้อมูล…'; try{ var r=await gs('getPlanRange',f,t); cache=r; return r; }catch(e){ $('dlRes').innerHTML='⚠ '+h(e.message||e); return null; } }
  $('preview').onclick=async function(){ var r=await load(); if(!r) return; $('dlRes').innerHTML='<div class="muted">'+r.rows.length+' รายการ · '+h(r.from)+(r.to!==r.from?' ถึง '+h(r.to):'')+'</div><div style="max-height:420px;overflow:auto;margin-top:6px"><table><tr><th>เบอร์ตู้</th><th>แถว</th><th>เวลาถ่าย</th><th>ถ่ายโดย</th></tr>'+r.rows.map(function(x){return '<tr><td class="no">'+h(x.no)+'</td><td>'+h(x.row)+'</td><td>'+h(x.time)+'</td><td>'+h(x.by)+'</td></tr>';}).join('')+'</table></div>'; };
  $('csv').onclick=async function(){ var r=cache||await load(); if(!r) return; var lines=[['เบอร์ตู้','แถว','เวลาถ่าย','ถ่ายโดย']].concat(r.rows.map(function(x){return [x.no,x.row,x.time,x.by];})); var csv='\uFEFF'+lines.map(function(l){return l.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n'); var a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download='แปลนลาน_'+r.from+(r.to!==r.from?'_'+r.to:'')+'.csv'; document.body.appendChild(a); a.click(); a.remove(); toast('ดาวน์โหลด '+r.rows.length+' รายการ'); };
  $('gsheet').onclick=async function(){ var f=$('dFrom').value, t=$('dTo').value; if(!f||!t){toast('เลือกวันที่');return;} $('gsheet').disabled=true; toast('กำลังสร้าง Google Sheet…'); try{ var r=await gs('exportPlanSheet',f<=t?f:t,f<=t?t:f); $('dlRes').innerHTML='<div>สร้างแล้ว: <a href="'+h(r.url)+'" target="_blank">'+h(r.name)+'</a> ('+r.count+' รายการ) — อยู่ในโฟลเดอร์ exports/</div>'; }catch(e){ toast('สร้างไม่ได้: '+(e.message||e),4000);} $('gsheet').disabled=false; };
}
async function adminSettings(body){
  body.innerHTML='<div class="card">กำลังโหลด…</div>';
  var s; try{ s=await gs('getSettings'); }catch(e){ body.innerHTML='⚠ '+h(e.message||e); return; }
  body.innerHTML='<div class="card"><h2>การอ่านเบอร์ตู้ (Gemini)</h2>'+
    '<label class="f">Gemini API key '+(s.hasKey?'<span class="tag g">ตั้งแล้ว '+h(s.geminiKeyMasked)+'</span>':'<span class="tag r">ยังไม่ตั้ง</span>')+'</label><input id="key" placeholder="วาง API key ใหม่ที่นี่ (เว้นว่างถ้าไม่เปลี่ยน)" autocomplete="off">'+
    '<div class="hint">สร้างฟรีที่ Google AI Studio → Get API key · key จะถูกเก็บฝั่งเซิร์ฟเวอร์ ไม่ส่งไปมือถือ</div>'+
    '<label class="f">โมเดล</label><input id="model" value="'+h(s.model)+'"><div class="hint">ค่าแนะนำ gemini-3.6-flash (ถ้าใช้ไม่ได้ ดูชื่อรุ่นล่าสุดที่ ai.google.dev)</div></div>'+
    '<div class="card"><h2>รูปและลายน้ำ</h2><div class="row"><div><label class="f">ตำแหน่งลายน้ำ</label><select id="wm">'+[['bl','ล่างซ้าย'],['br','ล่างขวา'],['tl','บนซ้าย'],['tr','บนขวา']].map(function(o){return '<option value="'+o[0]+'"'+(s.wmPos===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>'+
    '<div><label class="f">ด้านยาวของรูป (px)</label><input id="maxPx" type="number" value="'+s.maxPx+'"></div><div><label class="f">คุณภาพ JPEG (0.5–0.95)</label><input id="jpegQ" type="number" step="0.01" value="'+s.jpegQ+'"></div></div></div>'+
    '<div class="card"><h2>กติกา</h2><div class="row"><div><label class="f">ตู้สูงสุดต่อแถว</label><input id="maxPerRow" type="number" value="'+s.maxPerRow+'"></div><div><label class="f">ถ่ายซ้ำเกินกี่วัน = โฟลเดอร์ใหม่</label><input id="roundDays" type="number" value="'+s.roundDays+'"></div><div><label class="f">เก็บรูปแปลนลาน (วัน)</label><input id="retentionDays" type="number" value="'+s.retentionDays+'"></div></div>'+
    '</div>'+
    '<button class="primary big" id="save">บันทึกการตั้งค่า</button><div class="hint" style="text-align:center">เวอร์ชัน '+h(s.version)+'</div>';
  $('save').onclick=async function(){ $('save').disabled=true; try{ var patch={model:$('model').value.trim(),wmPos:$('wm').value,maxPx:+$('maxPx').value||1600,jpegQ:+$('jpegQ').value||0.82,maxPerRow:+$('maxPerRow').value||11,roundDays:+$('roundDays').value||30,retentionDays:+$('retentionDays').value||30}; if($('key').value.trim()) patch.geminiKey=$('key').value.trim(); await gs('saveSettings',patch); toast('บันทึกแล้ว'); S.today=await gs('getToday'); adminSettings(body); }catch(e){ toast('บันทึกไม่ได้: '+(e.message||e),4000); $('save').disabled=false; } };
}
async function adminList(body,key,label){
  body.innerHTML='<div class="card">กำลังโหลด…</div>';
  var s; try{ s=await gs('getSettings'); }catch(e){ body.innerHTML='⚠ '+h(e.message||e); return; }
  body.innerHTML='<div class="card"><label class="f">'+h(label)+'</label><textarea id="ta" rows="14">'+h((s[key]||[]).join('\n'))+'</textarea><div style="height:10px"></div><button class="primary" id="save">บันทึก</button></div>';
  $('save').onclick=async function(){ var arr=$('ta').value.split('\n').map(function(x){return x.trim();}).filter(Boolean); if(key==='staff') arr=arr.map(function(x){return x.substring(0,8);}); var p={}; p[key]=arr; try{ await gs('saveSettings',p); toast('บันทึกแล้ว ('+arr.length+')'); S.today=await gs('getToday'); }catch(e){ toast('บันทึกไม่ได้: '+(e.message||e),4000);} };
}

boot();
</script>
